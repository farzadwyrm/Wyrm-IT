name: Uptime

# Hourly check of the live guide pages and the Ask AI (scripts/uptime-check.sh).
# A failed run makes GitHub email the repository owner. About 1 Actions minute per run.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check site and Ask AI
        run: bash scripts/uptime-check.sh https://wyrm-it.vercel.app
